<h2>Find Transactions</h2>
<!-- ngIf used to only display the form once the categories have been fetched -->
@if (allCategories.length > 0 ) {
  <form #formDirective="ngForm" (ngSubmit)="onSubmit(formDirective)"
    [formGroup]="filterForm">
    <div class="grid p-fluid">
      <div class="col-12 md:col-4">
        <div class="p-inputgroup">
          <span class="p-inputgroup-addon">Oldest Date</span>
          <p-datepicker formControlName="dateOfOldestTransaction" [showIcon]="true" dateFormat="M d, yy" appendTo="body">
          </p-datepicker>
        </div>
      </div>
      <div class="col-12 md:col-4">
        <div class="p-inputgroup">
          <span class="p-inputgroup-addon">Latest Date</span>
          <p-datepicker formControlName="dateOfLatestTransaction" [showIcon]="true" dateFormat="M d, yy" appendTo="body">
          </p-datepicker>
        </div>
      </div>
      <div class="col-12 md:col-4">
        <p-multiSelect class="w-full" formControlName="multiSelectDropdown" [options]="filteredCategories" optionLabel="categoryName"
          display="chip" placeholder="(All Categories)" appendTo="body" [filter]="false" [showToggleAll]="false" [maxSelectedLabels]="1000"
          [scrollHeight]="'24rem'" panelStyleClass="category-multiselect-panel" (onPanelShow)="onCategoryPanelShow()">
          <ng-template pTemplate="header">
            <div class="category-filter-row">
              <div class="category-filter-input-wrap">
                <input pInputText type="text" class="category-filter-input" placeholder="Search"
                  [value]="categoryFilterText" (input)="onCategoryFilterInput($event)"
                  (keydown)="onCategoryFilterKeyDown($event)"
                  (keydown.delete)="onCategoryFilterDelete($event)">
                <button pButton type="button" icon="pi pi-times" aria-label="Clear category filter"
                  class="p-button-text p-button-rounded category-filter-clear"
                  [disabled]="!categoryFilterText" (click)="clearCategoryFilter()"></button>
              </div>
            </div>
          </ng-template>
        </p-multiSelect>
      </div>
      <div class="col-12 md:col-4">
        <p-button label="Submit" [disabled]="!filterForm.valid" (onClick)="onSubmit(formDirective)"></p-button>
      </div>
      @if ( !filterForm.valid && filterForm.errors != null) {
        <div class="col-12 md:col-8">
          <div class="p-inputgroup">
            <span class="p-inputgroup-addon">Error</span>
            <input placeholder="{{ filterForm.errors['datesError']['message']}}" [disabled]="true">
          </div>
        </div>
      }
    </div>
  </form>
}

<app-no-categories [visible]="noCategories"></app-no-categories>

<app-transactions [transactions]="transactionsFromFilter" [categories]="allCategories"></app-transactions>
