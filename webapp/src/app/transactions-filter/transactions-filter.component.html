<h2>Transactions</h2>
<p-toast position="top-right"></p-toast>
<p-confirmDialog></p-confirmDialog>
<app-add-edit (transactionAdded)="onTransactionAdded($event)"></app-add-edit>

<div class="find-header">
  <h3>Find</h3>
  <div class="find-totals">
    <span class="find-total-expenses" aria-label="Expenses">
      <i class="pi pi-arrow-down" aria-hidden="true"></i>
      {{ totalExpensesAmount | currency }}
    </span>
    <span class="find-total-income" aria-label="Income">
      <i class="pi pi-arrow-up" aria-hidden="true"></i>
      {{ totalIncomeAmount | currency }}
    </span>
  </div>
</div>
<!-- ngIf used to only display the form once the categories have been fetched -->
@if (allCategories.length > 0 ) {
  <form #formDirective="ngForm" (ngSubmit)="onSubmit()"
    [formGroup]="filterForm" (keydown)="onFormKeyDown($event)">
    <div class="find-controls p-fluid">
      <div class="find-filter-row">
        <div class="find-date-range">
          <div class="find-date">
            <p-datepicker formControlName="dateOfOldestTransaction" [showIcon]="true" dateFormat="M d, yy" appendTo="body">
            </p-datepicker>
          </div>
          <span class="find-date-arrow" aria-hidden="true">→</span>
          <div class="find-date">
            <p-datepicker formControlName="dateOfLatestTransaction" [showIcon]="true" dateFormat="M d, yy" appendTo="body">
            </p-datepicker>
          </div>
        </div>
        <div class="find-category">
          <app-category-multiselect formControlName="multiSelectDropdown" [options]="allCategories"
            placeholder="(All Categories)"
            (shortcutSubmit)="onCategoryShortcut()"></app-category-multiselect>
        </div>
        <div class="find-match" role="group" aria-label="Match">
          <div class="find-match-options">
            <button type="button" [class.active]="filterForm.controls['match'].value === 'All'"
              [attr.aria-pressed]="filterForm.controls['match'].value === 'All'" (click)="setMatch('All')">All</button>
            <button type="button" [class.active]="filterForm.controls['match'].value === 'Any'"
              [attr.aria-pressed]="filterForm.controls['match'].value === 'Any'" (click)="setMatch('Any')">Any</button>
          </div>
        </div>
      </div>
      <div class="find-search-row">
        <div class="find-search">
          <input formControlName="searchText" type="search" pInputText
            placeholder="Description">
        </div>
        <div class="find-submit">
          <p-button label="Go" type="submit" [disabled]="!filterForm.valid"></p-button>
        </div>
      </div>
      @if ( !filterForm.valid && filterForm.errors != null) {
        <div class="find-error">
          <div class="p-inputgroup">
            <span class="p-inputgroup-addon">Error</span>
            <input placeholder="{{ filterForm.errors['datesError']['message']}}" [disabled]="true">
          </div>
        </div>
      }
    </div>
  </form>
}

<app-no-categories [visible]="noCategories"></app-no-categories>

<section class="transaction-table-section">
  <div class="section-heading-row">
    <h3>Pending Transactions</h3>
    <p-button label="Accept All" icon="pi pi-check" [disabled]="pendingTransactions.length === 0"
      (onClick)="acceptAllPending()"></p-button>
  </div>
  <app-transactions [transactions]="pendingTransactions" [categories]="allCategories"
    [pendingMode]="true" [sortOrder]="1" confirmationKey="pending-transactions"
    (pendingSave)="savePending($event)"
    (pendingAccept)="acceptPending($event)"
    (pendingSkip)="skipPending($event)"></app-transactions>
</section>

<section class="transaction-table-section">
  <h3>Posted Transactions</h3>
<app-transactions [transactions]="transactionsFromFilter" [categories]="allCategories"
  confirmationKey="posted-transactions"></app-transactions>
</section>
