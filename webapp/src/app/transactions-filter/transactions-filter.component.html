<h2>Transactions</h2>
<app-add-edit (transactionAdded)="onTransactionAdded()"></app-add-edit>

<div class="find-header">
  <h3>Find</h3>
  <div class="find-totals">
    <span class="find-total-expenses" aria-label="Expenses">
      <i class="pi pi-arrow-down" aria-hidden="true"></i>
      {{ totalExpensesAmount | currency }}
    </span>
    <span class="find-total-income" aria-label="Income">
      <i class="pi pi-arrow-up" aria-hidden="true"></i>
      {{ totalIncomeAmount | currency }}
    </span>
  </div>
</div>
<!-- ngIf used to only display the form once the categories have been fetched -->
@if (allCategories.length > 0 ) {
  <form #formDirective="ngForm" (ngSubmit)="onSubmit()"
    [formGroup]="filterForm">
    <div class="find-controls p-fluid">
      <div class="find-date-range">
        <div class="find-date">
          <p-datepicker formControlName="dateOfOldestTransaction" [showIcon]="true" dateFormat="M d, yy" appendTo="body">
          </p-datepicker>
        </div>
        <span class="find-date-arrow" aria-hidden="true">→</span>
        <div class="find-date">
          <p-datepicker formControlName="dateOfLatestTransaction" [showIcon]="true" dateFormat="M d, yy" appendTo="body">
          </p-datepicker>
        </div>
      </div>
      <div class="find-category">
        <app-category-multiselect formControlName="multiSelectDropdown" [options]="allCategories"
          placeholder="(All Categories)"></app-category-multiselect>
      </div>
      <div class="find-submit">
        <p-button label="Go" [disabled]="!filterForm.valid" (onClick)="onSubmit()"></p-button>
      </div>
      @if ( !filterForm.valid && filterForm.errors != null) {
        <div class="find-error">
          <div class="p-inputgroup">
            <span class="p-inputgroup-addon">Error</span>
            <input placeholder="{{ filterForm.errors['datesError']['message']}}" [disabled]="true">
          </div>
        </div>
      }
    </div>
  </form>
}

<app-no-categories [visible]="noCategories"></app-no-categories>

<app-transactions [transactions]="transactionsFromFilter" [categories]="allCategories"></app-transactions>
