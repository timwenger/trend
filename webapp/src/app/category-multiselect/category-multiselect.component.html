<p-multiselect #multiSelect class="w-full"
  (pointerdown)="prepareMobilePanel()"
  [options]="filteredOptions"
  optionLabel="categoryName"
  display="chip"
  [placeholder]="placeholder"
  [appendTo]="appendTo"
  [filter]="false"
  [showToggleAll]="false"
  [maxSelectedLabels]="maxSelectedLabels"
  [scrollHeight]="scrollHeight"
  [readonly]="multiSelectReadOnly"
  panelStyleClass="category-multiselect-panel"
  [disabled]="disabled"
  [ngModel]="value"
  (ngModelChange)="onValueChange($event)"
  (onPanelShow)="onPanelShow()"
  (onPanelHide)="onPanelHide()"
  (onBlur)="onTouched()">
  <ng-template pTemplate="selecteditems" let-selectedCategories let-removeChip="removeChip">
    @for (category of selectedCategories; track category.id) {
      <div class="p-multiselect-chip-item">
        <p-chip [label]="category.categoryName" [removable]="!disabled"
          (onRemove)="removeChip(category, $event)"></p-chip>
      </div>
    }
  </ng-template>
  <ng-template pTemplate="header">
    <div class="category-filter-row">
      <div class="category-filter-input-wrap">
        <input pInputText type="text" class="category-filter-input" placeholder="Search"
          [readOnly]="mobileFilterReadOnly" (pointerdown)="enableMobileFilter($event)"
          (click)="enableMobileFilter($event)"
          [value]="filterText" (input)="onFilterInput($event)"
          (keydown)="onFilterKeyDown($event)"
          (keydown.delete)="onFilterDelete($event)"
          (keydown.escape)="onFilterEscape($event)">
        <button pButton type="button" aria-label="Clear category filter"
          class="p-button-text p-button-rounded category-filter-clear"
          [disabled]="!filterText" (click)="clearFilter()">
          <i class="pi pi-times" pButtonIcon></i>
        </button>
      </div>
    </div>
  </ng-template>
  <ng-template pTemplate="item" let-category>
    <div class="category-option-content"
      [class.category-option-divider]="hasPinnedDivider(category)"
      [class.category-option-inactive]="category.isInactive">
      <span class="category-option-name">{{category.categoryName}}</span>
      @if (!isAdditionalOption(category)) {
        <button type="button" class="category-option-toggle category-visibility-toggle"
          [class.category-visibility-toggle-active]="!category.isInactive"
          [attr.aria-label]="category.isInactive ? 'Make ' + category.categoryName + ' active' : 'Make ' + category.categoryName + ' inactive'"
          [attr.title]="category.isInactive ? 'Make category active' : 'Make category inactive'"
          [attr.aria-pressed]="!category.isInactive"
          (pointerdown)="stopOptionActionPointer($event)"
          (click)="toggleCategoryInactive($event, category)">
          <i [class]="category.isInactive ? 'pi pi-eye-slash' : 'pi pi-eye'" aria-hidden="true"></i>
        </button>
        <button type="button" class="category-option-toggle category-pin-toggle"
          [class.category-pin-toggle-pinned]="category.isPinned"
          [attr.aria-label]="category.isPinned ? 'Unpin ' + category.categoryName : 'Pin ' + category.categoryName"
          [attr.aria-pressed]="category.isPinned"
          (pointerdown)="stopOptionActionPointer($event)"
          (click)="togglePinned($event, category)">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 3h8l-1.5 5 3.5 3v2h-5v7l-1 1-1-1v-7H6v-2l3.5-3L8 3z"></path>
          </svg>
        </button>
      }
    </div>
  </ng-template>
  <ng-template pTemplate="footer">
    <div class="category-inactive-footer">
      <button pButton type="button"
        class="p-button-text category-inactive-toggle"
        [attr.aria-pressed]="showInactive" (click)="toggleInactive($event)">
        <i [class]="showInactive ? 'pi pi-eye-slash' : 'pi pi-eye'" pButtonIcon></i>
        <span pButtonLabel>{{showInactive ? 'Hide inactive' : 'Show inactive'}}</span>
      </button>
    </div>
  </ng-template>
</p-multiselect>
