<div class="trends-page p-4">
  <h2>Trends</h2>

  <div *ngIf="loading" class="loading-row">
    <i class="pi pi-spin pi-spinner" style="font-size:2rem"></i>
    <span>Loading transactions…</span>
  </div>

  <p-card *ngIf="!loading && errorMessage" styleClass="p-mb-4">
    <p class="p-error">{{ errorMessage }}</p>
  </p-card>

  <ng-container *ngIf="!loading && !errorMessage">

    <!-- Series controls -->
    <p-card styleClass="p-mb-4">
      <div class="series-controls">
        <div class="categories-row">
          <app-category-multiselect
            [options]="allCategories"
            [additionalOptions]="totalOptions"
            [ngModel]="selectedSeriesOptions"
            placeholder="Add series…"
            (ngModelChange)="onSeriesSelectionChange($event)">
          </app-category-multiselect>
        </div>
        <div class="button-row">
          <p-button
            [label]="defaultSaved ? 'Saved!' : 'Set as Default'"
            [icon]="defaultSaved ? 'pi pi-check' : 'pi pi-bookmark'"
            [severity]="defaultSaved ? 'success' : 'secondary'"
            size="small"
            (onClick)="saveAsDefault()">
          </p-button>
          <div class="line-style-key" aria-label="Trend line styles">
            <span>Prior year &rarr; <i class="line-style-sample prior-year-line" aria-hidden="true"></i> (thin stroke)</span>
            <span>Target &rarr; <i class="line-style-sample target-line" aria-hidden="true"></i> (dashed stroke)</span>
          </div>
        </div>
      </div>
    </p-card>

    <!-- Monthly rolling chart -->
    <p-card header="Monthly Totals (30-day rolling)" styleClass="p-mb-4">
      <div class="chart-header-row">
        <div class="date-range-row">
          <p-datepicker [(ngModel)]="chart1Start" (onSelect)="onDateChange()" (onBlur)="onDateChange()" [showIcon]="false" dateFormat="M d, yy"></p-datepicker>
          <span class="date-sep">&ndash;</span>
          <p-datepicker [(ngModel)]="chart1End" (onSelect)="onDateChange()" (onBlur)="onDateChange()" [showIcon]="false" dateFormat="M d, yy"></p-datepicker>
        </div>
        <label class="series-toggle">
          <p-checkbox [(ngModel)]="chart1ShowPriorYear" [binary]="true" (onChange)="onPriorYearChange(1)"></p-checkbox>
          <span class="swatch-thin">&mdash;</span>Overlay Prior Year
        </label>
        <label class="series-toggle">
          <p-checkbox [(ngModel)]="chart1ShowScatter" [binary]="true" (onChange)="onChart1ScatterChange()"></p-checkbox>
          <span class="swatch-dashed">&#10005;</span>Overlay Individual Transactions
        </label>
        <label class="series-toggle">
          <p-checkbox [(ngModel)]="chart1StartAtZero" [binary]="true" (onChange)="onStartAtZeroChange(1)"></p-checkbox>
          Start Y Axis at 0
        </label>
      </div>
      <div class="chart-container scrub-enabled"
        (pointerdown)="onChartScrubStart(1, $event)"
        (touchstart)="onChartTouchStart(1, $event)"
        (touchmove)="onChartTouchMove($event)"
        (touchend)="onChartTouchEnd($event)"
        (touchcancel)="onChartTouchEnd($event)">
        <canvas baseChart [data]="chart1Data" [options]="chart1Options" type="line"></canvas>
      </div>
    </p-card>

    <!-- Annual rolling chart -->
    <p-card header="Annual Totals (365-day rolling)" styleClass="p-mb-4">
      <div class="chart-header-row">
        <div class="date-range-row">
          <p-datepicker [(ngModel)]="chart2Start" (onSelect)="onDateChange()" (onBlur)="onDateChange()" [showIcon]="false" dateFormat="M d, yy"></p-datepicker>
          <span class="date-sep">&ndash;</span>
          <p-datepicker [(ngModel)]="chart2End" (onSelect)="onDateChange()" (onBlur)="onDateChange()" [showIcon]="false" dateFormat="M d, yy"></p-datepicker>
        </div>
        <label class="series-toggle">
          <p-checkbox [(ngModel)]="chart2ShowPriorYear" [binary]="true" (onChange)="onPriorYearChange(2)"></p-checkbox>
          <span class="swatch-thin">&mdash;</span>Overlay Prior Year
        </label>
        <label class="series-toggle">
          <p-checkbox [(ngModel)]="chart2ShowScatter" [binary]="true" (onChange)="onChart2ScatterChange()"></p-checkbox>
          <span class="swatch-dashed">&#10005;</span>Overlay Individual Transactions
        </label>
        <label class="series-toggle">
          <p-checkbox [(ngModel)]="chart2StartAtZero" [binary]="true" (onChange)="onStartAtZeroChange(2)"></p-checkbox>
          Start Y Axis at 0
        </label>
      </div>
      <div class="chart-container scrub-enabled"
        (pointerdown)="onChartScrubStart(2, $event)"
        (touchstart)="onChartTouchStart(2, $event)"
        (touchmove)="onChartTouchMove($event)"
        (touchend)="onChartTouchEnd($event)"
        (touchcancel)="onChartTouchEnd($event)">
        <ng-container *ngIf="!annualDateOnlyScrub; else annualScrubPreview">
          <canvas baseChart [data]="chart2Data" [options]="chart2Options" type="line"></canvas>
        </ng-container>
        <ng-template #annualScrubPreview>
          <div class="annual-scrub-preview">
            <div class="annual-scrub-blank-plot"></div>
            <div class="annual-scrub-x-axis">
              <span *ngFor="let label of annualScrubXAxisLabels">{{ label }}</span>
            </div>
          </div>
        </ng-template>
      </div>
    </p-card>

  </ng-container>
</div>
