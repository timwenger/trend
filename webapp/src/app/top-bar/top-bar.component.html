<div class="top-bar-container" [class.logged-out]="!isLoggedIn">
  <div class="top-bar-title">
    <h1>Trend</h1>
  </div>
  <p-menubar [model]="menuItems">
    <ng-template #end>
      @if (!this.isLoggedIn) {
        <button pButton class="login-button" (click)="login()">
          <i class="pi pi-angle-double-right" pButtonIcon></i>
          <span pButtonLabel>Login</span>
        </button>
      }
    </ng-template>
  </p-menubar>
</div>
