<div class="top-bar-container">
  <div class="top-bar-title">
    <h1>Trend</h1>
  </div>
  <p-menubar [model]="menuItems">
    <ng-template pTemplate="end">
      @if (!this.isLoggedIn) {
        <button pButton (click)="login()" label="Login" icon="pi pi-angle-double-right"></button>
      }
    </ng-template>
  </p-menubar>
</div>
