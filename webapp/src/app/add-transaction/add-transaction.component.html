<h3>Add</h3>
<!-- ngIf used to only display the form once the categories have been fetched -->
@if (allCategories.length > 0 ) {
  <form #formDirective="ngForm" (ngSubmit)="onSubmit(formDirective)"
    [formGroup]="addTransactionForm">
    <div class="add-controls p-fluid">
      <div class="add-primary-row">
        <div class="add-date">
        <div class="p-inputgroup date-inputgroup">
          <p-datepicker formControlName="dateOfTransaction" [numberOfMonths]="1" [showIcon]="false"
          [selectOtherMonths]="true" dateFormat="M d, yy" appendTo="body"></p-datepicker>
          <span class="p-inputgroup-addon date-nav-addon">
            <button pButton type="button" icon="pi pi-angle-left" class="p-button-text date-nav-btn"
              (click)="onClickPrevDate(formDirective)"></button>
          </span>
          <span class="p-inputgroup-addon date-nav-addon">
            <button pButton type="button" icon="pi pi-angle-right" class="p-button-text date-nav-btn"
              (click)="onClickNextDate(formDirective)"></button>
          </span>
        </div>
        </div>
        <div class="add-amount">
        <div class="p-inputgroup currency-inputgroup">
          <span class="p-inputgroup-addon">$</span>
          <input formControlName="amountInput" type="number" pInputText placeholder="Amount">
        </div>
        </div>
        <div class="add-category">
        <app-category-multiselect formControlName="categoriesDropdown" [options]="allCategories"
          placeholder="Tagged Categories"></app-category-multiselect>
        </div>
      </div>

      <div class="add-secondary-row">
        <div class="add-description">
          <input formControlName="descriptionInput" type="text" pInputText placeholder="Description">
        </div>
        <div class="add-submit">
          <p-button label="Go" [disabled]="!addTransactionForm.valid" (onClick)="onSubmit(formDirective)"></p-button>
        </div>
      </div>
    </div>
  </form>
}

<app-no-categories [visible]="noCategories"></app-no-categories>
