name: Validate .NET API production build

on:
  push:
    branches:
      - production
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        run: dotnet build --configuration Release

      - name: Test
        run: dotnet test Trend.Test/Trend.Test.csproj --configuration Release --no-build

      - name: dotnet publish
        run: dotnet publish Trend.API/Trend.API.csproj -c Release -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload published API
        uses: actions/upload-artifact@v7
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp
